apiVersion: omniverse.nvidia.com/v1
kind: ApplicationProfile
metadata:
  name: bottle-filling-twin-default
  namespace: omni-streaming
spec:
  name: Bottle Filling Twin Default
  description: Standard configuration for bottle filling simulation with 1 GPU, 64GB RAM.
  supportedApplications:
    - name: "bottle-filling-twin"
      versions:
        - "1.0.0"
        - "*"

  # Chart mappings define how OKAS maps its variables to Helm chart values
  chartMappings:
    # Map the main container image
    container: kitApp.image.repository
    container_version: kitApp.image.tag
    # Map session-specific values

  # Chart values to override in the Helm chart
  chartValues:
    # Global configuration
    global:
      imagePullSecrets:
        - name: acr-secret

    # Session information (will be populated by OKAS)
    session:
      name: "bottle-filling-twin"

    # Content initialization
    contentImage:
      enabled: true
      repository: <YOUR-ACR-REPOSITORY>/bottle-filling-digital-twin/content
      tag: latest
      pullPolicy: IfNotPresent
      sourcePath: /content

    # Fluent configuration
    fluent:
      image:
        repository: <YOUR-ACR-REPOSITORY>/ansys/pyfluent
        tag: v25.2.0
        pullPolicy: IfNotPresent
      port: 40007
      portSpan: 2
      workdirPath: /home/workdir
      contentPath: /app/content
      simulation:
        viscosity: "0.002"
        bottlesPerHour: "50000"
        fillingHeight: "28"
        timestepSize: "0.001"
        bottleUnits1: "48.0"
        bottleUnits2: "36.0"
        bottleUnits3: "24.0"
        firstIterationTimesteps: "500"
      resources:
        requests:
          memory: "32Gi"
          cpu: "8"
        limits:
          memory: "64Gi"
          cpu: "16"

    # Kit-app (Omniverse) configuration
    kitApp:
      image:
        repository: <YOUR-ACR-REPOSITORY>/bottle-filling-digital-twin/kit-app
        tag: latest
        pullPolicy: IfNotPresent
      ports:
        signaling: 49100
        media: 1024
        http: 8011
      workdirPath: /tmp/workdir
      contentPath: /app/content
      shaderCachePath: /home/ubuntu/.cache # Mount parent dir, kit-app creates 'ov' subdirectory
      extensionCachePath: /home/ubuntu/.local/share # Mount parent dir, kit-app creates 'ov' subdirectory
      shaderCache:
        enabled: false
      env:
        omKitVerbose: "1"
        nvdaKitArgs: ""
        nvdaKitNucleus: ""
      resources:
        requests:
          memory: "64Gi"
          cpu: "16"
        limits:
          memory: "128Gi"
          cpu: "20"
      podSecurityContext:
        runAsUser: 0 # Root user
        runAsGroup: 0 # Root group
        fsGroup: 0 # Root filesystem group
        supplementalGroups: [44] # Video group for GPU device access
      securityContext:
        privileged: true # Full privileges for GPU access
        allowPrivilegeEscalation: true

    # Envoy sidecar
    envoy:
      enabled: true
      image:
        repository: envoyproxy/envoy
        tag: v1.18-latest
        pullPolicy: IfNotPresent
      proxyPort: 49200
      healthPort: 8080
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5

    # Storage configuration
    storage:
      storageClass: "managed-csi" # Default for RWO volumes (cheapest - Azure Disk)
      fluentWorkdir:
        enabled: true
        type: emptyDir
        size: 2Gi
        sizeLimit: 2Gi
      contentData:
        enabled: true
        type: emptyDir
        size: 5Gi
        sizeLimit: 5Gi
        readOnly: false
      contentStored:
        enabled: true
        type: pvc
        size: 20Gi
        accessMode: ReadWriteMany
        readOnly: false
        storageClass: "azurefile-csi" # Override for RWX - Azure Files required
      shaderCache:
        enabled: true
        type: pvc
        size: 2Gi
        accessMode: ReadWriteMany
        readOnly: false
        storageClass: "azurefile-csi" # Override for RWX - Azure Files required
      extensionCache:
        enabled: true
        type: emptyDir
        sizeLimit: 2Gi

    # Service configuration
    service:
      type: LoadBalancer
      sessionAffinity: ClientIP
      annotations:
        external-dns.alpha.kubernetes.io/ttl: '5'
        service.beta.kubernetes.io/azure-load-balancer-internal: 'false'
        service.beta.kubernetes.io/port_8080_health-probe_port: '8080'
        service.beta.kubernetes.io/port_8080_health-probe_protocol: HTTP
        service.beta.kubernetes.io/port_8080_health-probe_request-path: /health
      ports:
        media:
          port: 1024
          targetPort: 1024
          protocol: UDP
        signaling:
          port: 49100
          targetPort: 49200
          protocol: TCP
        health:
          port: 8080
          targetPort: 8080
          protocol: TCP

    # Pod configuration
    pod:
      annotations: {}
      labels: {}
      nodeSelector:
        nvidia.com/gpu.present: "true"
      priorityClassName: ""
      tolerations: []

    # License configuration (ensure this secret exists)
    license:
      secretName: ansys-license-secret
      secretKey: ANSYSLMD_LICENSE_FILE

    # Pod anti-affinity
    podAntiAffinity:
      enabled: true

    # GPU configuration
    gpu:
      driverCapabilities: "compute,utility,video,graphics"
      visibleDevices: "all"
