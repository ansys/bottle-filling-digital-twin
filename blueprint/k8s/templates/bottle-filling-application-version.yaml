apiVersion: omniverse.nvidia.com/v1
kind: ApplicationVersion
metadata:
  name: ${APPLICATION_ID}-${APPLICATION_VERSION}
  namespace: omni-streaming
  labels:
    app: ${APPLICATION_ID}
    applicationName: ${APPLICATION_ID}
    version: '${APPLICATION_VERSION}'
spec:
  # Reference OCI HelmRepository by name
  helm_chart: ${HELM_REPOSITORY_NAME}/${HELM_CHART_NAME}
  helm_chart_version: '${HELM_CHART_VERSION}'

  # Main container image (kit-app) from ACR
  container: ${KIT_APP_IMAGE}
  container_version: '${KIT_APP_IMAGE_TAG}'
