controller:
  image:
    registry: registry.k8s.io
    image: ingress-nginx/controller
    tag: "v1.13.3"   # includes nginx/1.27.1
  ingressClass: internal-nginx
  ingressClassResource:
    name: internal-nginx
    controllerValue: "k8s.io/internal-ingress-nginx"
  config:
    proxy-body-size: "0"
    proxy-request-buffering: "off"
    ssl-ciphers: "HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:@SECLEVEL=1"
    ssl-protocols: "TLSv1.2 TLSv1.3"
    use-http2: "false"
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  replicaCount: 1
  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
      service.beta.kubernetes.io/azure-load-balancer-resource-group: ${RESOURCE_GROUP_NAME}
      service.beta.kubernetes.io/azure-load-balancer-internal: "false"
      external-dns.alpha.kubernetes.io/access: "public"
      service.beta.kubernetes.io/azure-pip-name: ${PUBLIC_IP_NAME}
      external-dns.alpha.kubernetes.io/hostname: ${PUBLIC_IP_FQDN}
      nginx.ingress.kubernetes.io/hsts: false
    externalTrafficPolicy: Local
defaultBackend:
  enabled: true