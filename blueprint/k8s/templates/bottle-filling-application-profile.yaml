apiVersion: omniverse.nvidia.com/v1
kind: ApplicationProfile
metadata:
  name: ${APPLICATION_PROFILE}
  namespace: omni-streaming
spec:
  name: Bottle Filling Twin Default
  description: Standard configuration for bottle filling simulation with 1 GPU, 64GB RAM.
  supportedApplications:
  - name: ${APPLICATION_ID}
    versions:
    - ${APPLICATION_VERSION}
    - '*'
  chartMappings:
    container: kitApp.image.repository
    container_version: kitApp.image.tag
  chartValues:
    envoy:
      enabled: true
      healthPort: 8080
      image:
        pullPolicy: IfNotPresent
        repository: envoyproxy/envoy
        tag: v1.18-latest
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
      proxyPort: 49200
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi
    fluent:
      enabled: true
      contentPath: /app/content
      image:
        pullPolicy: IfNotPresent
        repository: ${FLUENT_IMAGE}
        tag: ${FLUENT_IMAGE_TAG}
      port: 40007
      portSpan: 2
      resources:
        limits:
          cpu: '16'
          memory: 64Gi
        requests:
          cpu: '8'
          memory: 32Gi
      simulation:
        bottleUnits1: ${BOTTLE_UNITS_1}
        bottleUnits2: ${BOTTLE_UNITS_2}
        bottleUnits3: ${BOTTLE_UNITS_3}
        bottlesPerHour: ${BOTTLES_PER_HOUR}
        fillingHeight: ${FILLING_HEIGHT}
        firstIterationTimesteps: ${FIRST_ITERATION_TIMESTEPS}
        timestepSize: ${TIMESTEP_SIZE}
        viscosity: ${VISCOSITY}
      workdirPath: /home/workdir
      # Node pool configuration for Fluent (from GPU_POOL_2ND in exports.sh)
      nodePool: ${GPU_POOL_2ND}
      nodeSelector: {}
      tolerations: []
    gpu:
      driverCapabilities: compute,utility,video,graphics
      visibleDevices: all
    imagePullSecrets:
    - name: acr-secret
    initContainer:
      enabled: true
      image:
        pullPolicy: IfNotPresent
        repository: busybox
        tag: latest
    kitApp:
      enabled: true
      contentPath: /app/content
      env:
        nvdaKitArgs: '${NVDA_KIT_ARGS}'
        nvdaKitNucleus: ''
        omKitVerbose: '1'
      image:
        pullPolicy: Always
        repository: ${KIT_APP_IMAGE}
        tag: ${KIT_APP_IMAGE_TAG}
      ports:
        http: 8011
        media: 1024
        signaling: 49100
      resources:
        limits:
          cpu: '20'
          memory: 128Gi
        requests:
          cpu: '16'
          memory: 64Gi
      securityContext:
        privileged: true
      shaderCache:
        enabled: true
      workdirPath: /tmp/workdir
      # Node pool configuration for Kit-app (from GPU_POOL in exports.sh)
      nodePool: ${GPU_POOL}
      nodeSelector: {}
      tolerations: []
    license:
      secretKey: ANSYSLMD_LICENSE_FILE
      secretName: ansys-license-secret
    pod:
      annotations: {}
      labels: {}
      nodeSelector:
        nvidia.com/gpu.present: 'true'
      priorityClassName: ''
      tolerations: []
    podAntiAffinity:
      enabled: true
    service:
      annotations:
        external-dns.alpha.kubernetes.io/ttl: '5'
        service.beta.kubernetes.io/azure-load-balancer-internal: 'false'
        service.beta.kubernetes.io/port_8080_health-probe_port: '8080'
        service.beta.kubernetes.io/port_8080_health-probe_protocol: HTTP
        service.beta.kubernetes.io/port_8080_health-probe_request-path: /health
      ports:
        health:
          port: 8080
          protocol: TCP
          targetPort: 8080
        media:
          port: 1024
          protocol: UDP
          targetPort: 1024
        signaling:
          port: 49100
          protocol: TCP
          targetPort: 49200
      sessionAffinity: ClientIP
      type: LoadBalancer
    serviceAccount:
      annotations: {}
      automount: true
      create: true
      name: ''
    session:
      name: bottle-filling-twin
    storage:
      contentData:
        accessMode: ReadWriteOnce
        azureFile:
          readOnly: false  # Kit-app needs write access to generate journal files
          secretName: azure-storage-secret
          shareName: ${FILE_SHARE_NAME}  # Shared across all sessions
        enabled: true
        existingClaim: ''
        readOnly: false  # Kit-app needs write access for journal file generation (Fluent mounts as read-only)
        size: 100Gi
        sizeLimit: 2Gi
        type: azureFile
      extensionCache:
        enabled: true
        size: 2Gi
        sizeLimit: 2Gi
        type: emptyDir
      fluentWorkdir:
        accessMode: ReadWriteMany
        enabled: true
        existingClaim: ''
        size: 2Gi
        sizeLimit: 2Gi
        type: azureFile
        useSessionSubPath: true  # Use session-specific subdirectories for multiple sessions
        azureFile:
          readOnly: false
          secretName: azure-storage-secret
          shareName: ${FILE_SHARE_NAME}-fluent-workdir  # Shared file share with session-specific subdirs
      shaderCache:
        enabled: true
        size: 2Gi
        sizeLimit: 2Gi
        type: emptyDir
      omniverseCache:
        accessMode: ReadWriteMany
        enabled: true
        existingClaim: ''
        size: 50Gi
        type: azureFile
        azureFile:
          readOnly: false
          secretName: azure-storage-secret
          shareName: ${FILE_SHARE_NAME}-omniverse-cache  # Shared cache across all sessions
      storageClass: ''
    streamingKit:
      name: bottle-filling-twin
      sessionId: ''
      userId: ''
