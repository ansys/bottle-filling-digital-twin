# Default values for bottle-filling-twin Helm chart
# This is a YAML-formatted file for deploying bottle-filling digital twin on Kubernetes
# Designed for OKAS (Omniverse Kit App Streaming) compatibility

# Session Configuration (OKAS Integration)
session:
  name: "bottle-filling-twin"

# Content Image Configuration (Method 2: Container Image)
# This image should contain all simulation content files (.jou, .cas.h5, materials, etc.)
contentImage:
  enabled: true
  repository: <YOUR-ACR-REPOSITORY>/bottle-filling-digital-twin/content
  tag: latest
  pullPolicy: IfNotPresent
  # Source path inside the content image where files are located
  sourcePath: /content

# Fluent Simulation Engine Configuration
fluent:
  image:
    repository: <YOUR-ACR-REPOSITORY>/ansys/pyfluent
    tag: v25.2.0
    pullPolicy: IfNotPresent

  port: 40007
  portSpan: 2

  # Mount paths for Fluent container
  workdirPath: /home/workdir
  contentPath: /app/content

  simulation:
    viscosity: "0.002"
    bottlesPerHour: "50000"
    fillingHeight: "28"
    timestepSize: "0.001"
    bottleUnits1: "48.0"
    bottleUnits2: "36.0"
    bottleUnits3: "24.0"
    firstIterationTimesteps: "500"
  resources:
    requests:
      memory: "32Gi"
      cpu: "8"
    limits:
      memory: "64Gi"
      cpu: "16"

# Kit-App (Omniverse) Configuration
kitApp:
  image:
    repository: <YOUR-ACR-REPOSITORY>/bottle-filling-digital-twin/kit-app
    tag: latest
    pullPolicy: IfNotPresent

  ports:
    signaling: 49100
    media: 1024
    http: 8011

  # Mount paths for Kit-app container
  workdirPath: /tmp/workdir
  contentPath: /app/content
  shaderCachePath: /home/ubuntu/.cache # Mount parent dir, kit-app creates 'ov' subdirectory
  extensionCachePath: /home/ubuntu/.local/share # Mount parent dir, kit-app creates 'ov' subdirectory

  env:
    omKitVerbose: "1"
    nvdaKitArgs: ""
    nvdaKitNucleus: ""

  resources:
    requests:
      memory: "64Gi"
      cpu: "16"
    limits:
      memory: "128Gi"
      cpu: "20"

  securityContext:
    runAsUser: 0 # Root user
    runAsGroup: 0 # Root group
    fsGroup: 0 # Root filesystem group
    supplementalGroups: [44] # Video group
    privileged: true

# Envoy Proxy Sidecar Configuration (OKAS Pattern)
envoy:
  enabled: true
  image:
    repository: envoyproxy/envoy
    tag: v1.18-latest
    pullPolicy: IfNotPresent

  proxyPort: 49200
  healthPort: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

# Storage Configuration
storage:
  storageClass: "managed-csi" # Default for RWO volumes (cheapest)

  fluentWorkdir:
    enabled: true
    type: emptyDir
    size: 2Gi
    accessMode: ReadWriteOnce
    existingClaim: ""
    sizeLimit: 2Gi # For emptyDir type

  contentData:
    enabled: true
    type: emptyDir
    size: 5Gi
    accessMode: ReadWriteOnce
    readOnly: false
    existingClaim: ""
    sizeLimit: 5Gi # For emptyDir type

  contentStored:
    enabled: true
    type: pvc
    size: 20Gi
    accessMode: ReadWriteMany
    readOnly: false
    existingClaim: ""
    sizeLimit: 20Gi # For emptyDir type
    storageClass: "azurefile-csi" # Override for RWX - Azure Files required

  shaderCache:
    enabled: true
    type: emptyDir # Use emptyDir to avoid Azure Files permission issues
    size: 2Gi
    accessMode: ReadWriteOnce
    readOnly: false
    existingClaim: ""
    sizeLimit: 2Gi # For emptyDir type
    storageClass: "" # Not used for emptyDir

  extensionCache:
    enabled: true
    type: emptyDir
    size: 2Gi # For PVC type
    sizeLimit: 2Gi # For emptyDir type

# License Configuration
license:
  secretName: ansys-license-secret
  secretKey: ANSYSLMD_LICENSE_FILE

# Service Configuration
service:
  type: LoadBalancer
  sessionAffinity: ClientIP

  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
    external-dns.alpha.kubernetes.io/ttl: "5"
    service.beta.kubernetes.io/port_8080_health-probe_protocol: HTTP
    service.beta.kubernetes.io/port_8080_health-probe_port: "8080"
    service.beta.kubernetes.io/port_8080_health-probe_request-path: /health

  ports:
    media:
      port: 1024
      targetPort: 1024
      protocol: UDP

    signaling:
      port: 49100
      targetPort: 49200
      protocol: TCP

    health:
      port: 8080
      targetPort: 8080
      protocol: TCP

# Pod Configuration
pod:
  annotations: {}
  labels: {}
  nodeSelector:
    nvidia.com/gpu.present: "true"
  priorityClassName: "" # Optional: Set priority class for pod scheduling
  tolerations: [] # Optional: Add tolerations for node taints

# Init Container Configuration
initContainer:
  enabled: true
  image:
    repository: busybox
    tag: latest
    pullPolicy: IfNotPresent

# Image Pull Secrets
imagePullSecrets:
  - name: acr-secret

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod Anti-Affinity Configuration
podAntiAffinity:
  enabled: true

# GPU Configuration
gpu:
  driverCapabilities: "compute,utility,video,graphics"
  visibleDevices: "all"

streamingKit:
  sessionId: ""
  name: "bottle-filling-twin"
  userId: ""
