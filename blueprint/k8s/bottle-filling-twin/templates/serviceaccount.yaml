{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bottle-filling-twin.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    # Mandatory labels: ensure `app` and `sessionId` are always present.
    app: {{ include "bottle-filling-twin.name" . }}-{{ .Values.streamingKit.sessionId }}
    sessionId: {{ .Values.streamingKit.sessionId }}
    {{- include "bottle-filling-twin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
