{{- if and .Values.storage.fluentWorkdir.enabled (eq .Values.storage.fluentWorkdir.type "pvc") (not .Values.storage.fluentWorkdir.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bottle-filling-twin.pvc.fluentWorkdir" . }}
  namespace: {{ include "bottle-filling-twin.namespace" . }}
  labels:
    # Mandatory labels: ensure `app` and `sessionId` are always present.
    app: {{ include "bottle-filling-twin.name" . }}-{{ .Values.streamingKit.sessionId }}
    sessionId: {{ .Values.streamingKit.sessionId }}
    {{- include "bottle-filling-twin.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.fluentWorkdir.size }}
{{- end }}

{{- if and .Values.storage.contentData.enabled (eq .Values.storage.contentData.type "pvc") (not .Values.storage.contentData.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bottle-filling-twin.pvc.contentData" . }}
  namespace: {{ include "bottle-filling-twin.namespace" . }}
  labels:
    # Mandatory labels: ensure `app` and `sessionId` are always present.
    app: {{ include "bottle-filling-twin.name" . }}-{{ .Values.streamingKit.sessionId }}
    sessionId: {{ .Values.streamingKit.sessionId }}
    {{- include "bottle-filling-twin.labels" . | nindent 4 }}
