{{- if and .Values.storage.contentStored.enabled (eq .Values.storage.contentStored.type "pvc") (not .Values.storage.contentStored.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bottle-filling-twin.pvc.contentStored" . }}
  namespace: {{ include "bottle-filling-twin.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep  # Prevent Helm from deleting this PVC
  labels:
    # Global shared PVC - not tied to a specific session
    app: {{ include "bottle-filling-twin.name" . }}
    {{- include "bottle-filling-twin.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-shared
spec:
  accessModes:
    - ReadWriteMany  # Shared across multiple pods
  {{- if .Values.storage.contentStored.storageClass }}
  storageClassName: {{ .Values.storage.contentStored.storageClass | quote }}
  {{- else if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.contentStored.size }}
{{- end }}

