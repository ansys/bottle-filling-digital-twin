apiVersion: v1
kind: Service
metadata:
  name: {{ include "bottle-filling-twin.fullname" . }}
  namespace: {{ include "bottle-filling-twin.namespace" . }}
  labels:
    # Mandatory labels: ensure `app` and `sessionId` are always present.
    app: {{ include "bottle-filling-twin.name" . }}-{{ .Values.streamingKit.sessionId }}
    sessionId: {{ .Values.streamingKit.sessionId }}
    hello: "world"
    {{- include "bottle-filling-twin.labels" . | nindent 4 }}
  {{ if .Values.service.annotations  }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}

spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- end }}
  ports:
    # Media port (UDP, direct to kit-app)
    - port: {{ .Values.service.ports.media.port }}
      targetPort: {{ .Values.kitApp.ports.media }}
      protocol: {{ .Values.service.ports.media.protocol }}
      name: media
    # Signaling port (TCP, via Envoy proxy)
    - port: {{ .Values.service.ports.signaling.port }}
      {{- if .Values.envoy.enabled }}
      targetPort: {{ .Values.service.ports.signaling.targetPort }}  # Envoy proxy
      {{- else }}
      targetPort: {{ .Values.kitApp.ports.signaling }}
      {{- end }}
      protocol: {{ .Values.service.ports.signaling.protocol }}
      name: signaling
    {{- if .Values.envoy.enabled }}
    # Health check endpoint (Envoy)
    - port: {{ .Values.service.ports.health.port }}
      targetPort: {{ .Values.envoy.healthPort }}
      protocol: {{ .Values.service.ports.health.protocol }}
      name: health
    {{- end }}
  selector:
    {{- include "bottle-filling-twin.selectorLabels" . | nindent 4 }}
