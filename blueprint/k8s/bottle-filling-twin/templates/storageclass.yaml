{{- if .Values.storage.shaderCache.enabled }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-csi-with-uid
provisioner: file.csi.azure.com
parameters:
  skuName: Standard_LRS
mountOptions:
  - uid=1000
  - gid=1000
  - dir_mode=0775
  - file_mode=0664
  - mfsymlinks
  - cache=strict
  - nosharesock
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}
