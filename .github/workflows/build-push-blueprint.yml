name: Build and Push Blueprint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@v10
        with:
          use-python-cache: false

  run-unit-tests:
    name: Run Messaging extension unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # Adjust the Python version as needed

      - name: Install pytest
        run: pip install pytest

      - name: Run Unit Tests
        run: |
          cd blueprint/kit-app-source/source/extensions/ansys.messaging/ && pytest tests/unit
